name: Update CTFtime ranking

on:
  schedule:
    - cron: "17 3 * * *"   # 매일 03:17 UTC (12:17 KST)
  workflow_dispatch:

permissions:
  contents: write
  pages: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch ranking from CTFtime
        run: |
          curl -fsSL --retry 3 -A "Mozilla/5.0 (CheongA site sync)" \
            https://ctftime.org/api/v1/teams/414320/ -o team.json
          python3 - <<'PY'
          import json, datetime
          t = json.load(open("team.json"))
          rt = t.get("rating", {})
          if isinstance(rt, list):
              ratings = {}
              for item in rt:
                  ratings.update(item)
          else:
              ratings = rt
          year = str(datetime.date.today().year)
          if year not in ratings:
              year = max(ratings)
          r = ratings[year]
          out = {
              "year": int(year),
              "global": r["rating_place"],
              "country": r["country_place"],
              "countryName": t.get("country", ""),
              "points": f'{float(r["rating_points"]):.3f}',
              "url": "https://ctftime.org/team/414320",
              "updated": datetime.date.today().isoformat(),
          }
          json.dump(out, open("ranking.json", "w"), indent=2)
          open("ranking.json", "a").write("\n")
          print(out)
          PY
          rm -f team.json

      - name: Commit if changed
        run: |
          # 순위 값이 같으면 updated 날짜만 바뀐 커밋을 만들지 않음
          if git diff --quiet -I'"updated"' -- ranking.json; then
            git checkout -- ranking.json
            echo "no ranking change"; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ranking.json
          git commit -m "chore: sync CTFtime ranking"
          git push
          gh api -X POST "/repos/$GITHUB_REPOSITORY/pages/builds" || true
        env:
          GH_TOKEN: ${{ github.token }}
